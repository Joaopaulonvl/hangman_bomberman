<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/favicon.png">
    <link rel="stylesheet" href="../styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <title>HANGMAN GAME</title>
</head>
<body class="game-page">
    <div class="row align-items-center text-center p-2">
        <div>
            <button id="fullScreenButton" class="mainButton">
                <span class="button_top gameTitle">ENTER FULL SCREEN (RECOMMENDED)</span>
            </button>
        </div>
        <p>GUESS THE WORD TO SAVE BOMBERMAN!</p>
    </div>
    <div class="container">
        <div class="row align-items-center">
            <div class="col-12 col-md-4 d-flex flex-column align-items-center mb-5 mb-md-0">
                <img id="mainCharacter" src="../images/Bomberman.gif" width="100px" height="150px" alt="Bomberman.">
                <div class="text-center">
                    <img id="bomb" class="bomb" src="../images/bomb.gif" width="50px" height="50px">
                    <hr>
                    <h2 class="errors"></h2>
                </div>
            </div>
            <div class="col-12 col-md-8 text-center">
                <div class="col"><h1 id="word-display"></h1>
                    <h3 class="col text" style="color: white;" id="tip-display"></h3>
                </div>
            </div>
        </div>
 
    </div>

    <div id="game-container">
        <div id="display" class="display">Click in the letters below</div>
        <div id="keyboard" class="keyboard-grid"></div>
    </div>
    
    <div>
        <button id="backButton" class="mainButton">
            <span class="button_top gameTitle">RETURN TO MENU</span>
        </button>
        <button id="resetButton" class="mainButton">
            <span class="button_top gameTitle">RESET</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./game.js"></script>
</body>
</html>
